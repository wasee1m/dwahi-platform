# بوابات الجودة لكل تعديل (04 §9، 09 §13.3): backend و frontend و mobile كل منها في وظيفة مستقلة
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel + MySQL 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dwahi_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dwahi_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, bcmath, intl, zip, gd, redis
          coverage: none

      # سجل التدقيق الإلحاقي يُنشئ Triggers، والسجل الثنائي مفعّل في MySQL 8.4
      - name: Prepare MySQL
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1; SET GLOBAL time_zone = '+00:00';"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests (Pest, real MySQL)
        run: ./vendor/bin/pest

      # العقد مولّد من الكود: يجب أن يكون الملف المحفوظ مطابقاً للكود
      - name: OpenAPI contract is up to date
        run: |
          php artisan scramble:export --path=../contracts/openapi/openapi.json
          git diff --exit-code -- ../contracts/openapi/openapi.json || (echo "::error::contracts/openapi/openapi.json is stale. Run scramble:export and commit it." && exit 1)

      # منع التغيير الكاسر للتطبيقات القديمة (04 §4.1): تحتاج /api/v2 بدلاً منه
      - name: No breaking API changes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git show origin/${{ github.base_ref }}:contracts/openapi/openapi.json > /tmp/base.json 2>/dev/null || { echo "No base contract yet"; exit 0; }
          docker run --rm -v /tmp:/base -v "$PWD/contracts/openapi":/head tufin/oasdiff:v1.11.7 breaking /base/base.json /head/openapi.json --fail-on ERR

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.d.ts || (echo "::error::Run npm run gen:api and commit the result." && exit 1)

      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Lint
        run: npx eslint src

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [packages/dwahi_ui, customer_app, technician_app]
    defaults:
      run:
        working-directory: mobile/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
