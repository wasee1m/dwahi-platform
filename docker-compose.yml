# بيئة التطوير المحلية (04 §9): MySQL 8.4 و Redis و خادم Laravel (backend/)
# التشغيل: docker compose up -d
name: dwahi

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # لإنشاء Triggers (سجل التدقيق الإلحاقي) بمستخدم التطبيق مع تفعيل السجل الثنائي
      - --log-bin-trust-function-creators=1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  api:
    build: ./infra/docker/api
    image: dwahi-api-dev
    command: php artisan serve --host=0.0.0.0 --port=8000
    # المسارات داخل الحاوية تطابق المستودع، فأوامر مثل scramble:export تعمل بنفس المسار النسبي في كل مكان
    working_dir: /var/www/backend
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend:/var/www/backend
      # الاعتماديات في Volume داخلي لا في مجلد Windows: قراءتها أسرع بكثير. تُثبَّت بـ composer install داخل الحاوية
      - api-vendor:/var/www/backend/vendor
      # عقد OpenAPI المولّد (04 §13)، يقرؤه الويب والتطبيقات لتوليد عملائها
      - ./contracts:/var/www/contracts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: dwahi-api-dev
    command: php artisan queue:work --tries=3 --backoff=10
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - api-vendor:/var/www/backend/vendor
    depends_on:
      - api

  # المهام المجدولة (02 §9): J-02 و J-03 و J-08. نسخة واحدة فقط (04 §9)
  scheduler:
    image: dwahi-api-dev
    command: php artisan schedule:work
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - api-vendor:/var/www/backend/vendor
    depends_on:
      - api

  # فحص الملفات المرفوعة (NFR-11)، اختياري في التطوير: docker compose --profile av up، مع ANTIVIRUS_DRIVER=clamav
  clamav:
    image: clamav/clamav:1.4
    profiles: ["av"]
    ports:
      - "3310:3310"

volumes:
  mysql-data:
  redis-data:
  api-vendor:
