memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 110M
date.timezone = UTC

; ملفات الكود مشتركة من Windows، وقراءتها بطيئة عبر Docker Desktop. OPcache يحفظ الملفات المترجمة،
; ويعيد فحص التعديلات كل ثانيتين، فيبقى التعديل أثناء التطوير ظاهراً.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
